        prompt_template:
        - id: 6b1b5646-f84b-419c-aaf0-122306ff3091
          role: system
          text: "入力は検査報告書をOCRしたタブ区切りテキストです。\n「検査項目\t検査結果\t単位\t基準値」というヘッダー行より下が検査項目の表で、\n\
            各行は必ず4列あります。空の列は、その欄に何も印字されていないことを意味します。\n\nヘッダー行より下の行を、1行につき1件、上から順にすべてJSONにしてください。\n\
            JSONのみを出力し、説明文は書かないでください。\n\n## 最も重要な規則\n- 行を省略してはならない。空の列がある行も、見出しに見える行も、必ず1件出力する\n\
            - 行をまとめたり分割したりしてはならない。入力の行数と出力の件数は必ず一致する\n- 列を移し替えてはならない。1列目はname、2列目はresult、3列目はunit、4列目はrefに入れる\n\
            - 単位を name に付け足してはならない\n\n## 転記の例(入力5行 → 出力5件。空の列は空文字のまま写す)\n  HBs抗原精密測定\t\
            陰性　インセイ\t\t\n  IU/mL\t0.05未満\tIU/mL\t0.05未満 陰性\n  HBs抗体精密測定\t\t\t\n  mIU/mL\t\
            \tmIU/mL\t\n  RPR定性\t\t\t\n→\n  {\"name\":\"HBs抗原精密測定\",\"result\":\"\
            陰性\",\"unit\":\"\",\"ref\":\"\"}\n  {\"name\":\"IU/mL\",\"result\":\"\
            0.05未満\",\"unit\":\"IU/mL\",\"ref\":\"0.05未満 陰性\"}\n  {\"name\":\"HBs抗体精密測定\"\
            ,\"result\":\"\",\"unit\":\"\",\"ref\":\"\"}\n  {\"name\":\"mIU/mL\",\"\
            result\":\"\",\"unit\":\"mIU/mL\",\"ref\":\"\"}\n  {\"name\":\"RPR定性\"\
            ,\"result\":\"\",\"unit\":\"\",\"ref\":\"\"}\n\n1列目が単位(IU/mL など)の行も、そのまま\
            \ name に入れて1件として出力すること。\n直前の行と一緒にしてはならない。統合は後の工程で行うので、ここでは決してしない。\n\n\
            ## 値の整形(ここだけが変更してよい点)\n- 値は必ず日本語で書く。簡体字(阴 检 结 项 单 值 测 满 磷 など)を使ってはならない\n\
            - result の先頭にある矢印(↑ ⇓ など)は取り除く。「↑ 43.5」→「43.5」\n- name の末尾にある矢印も取り除く。「Intact↑」→「Intact」\n\
            - result は数値でも文字列として出力する。「9.70」は \"9.70\" のまま\n- 「0.05以下」「0.05未満」は数値だけを取り出さず全文をそのまま出力する\n\
            - 「陰性　インセイ」「陽性　ヨウセイ」の読み仮名は除き「陰性」「陽性」とする\n- 「1. 0未満」「13.5~ 17.6」のような数字途中の空白は詰める\n\
            \n## 項目名\n1列目の表記をそのまま使う。言い換えたり省略したりしてはならない。\n\n## date / time / dialysis\n\
            ヘッダー行より上に、受付日・報告日・採取日が並んだ行がある。\n必ず「採取日」の直後にある日付と時刻を使い、受付日・報告日の日付は使ってはならない。\n\
            \  例: 受付日，26/7/20\t報告日\t日26/7/22\t採取日\t'26/7/20 21:00\n      → date は\
            \ \"26/7/20\"、time は \"21:00\"\ndialysis は、ヘッダー行より上に「透析前」または「透析後」があればその語をそのまま入れる。\n\
            どちらも無ければ空文字列。\n\n## 出力形式(キー名は必ずこの英字のまま使うこと)\n{\"date\":\"\",\"time\":\"\
            \",\"dialysis\":\"\",\"items\":[{\"name\":\"\",\"result\":\"\",\"unit\"\
            :\"\",\"ref\":\"\"}]}"
