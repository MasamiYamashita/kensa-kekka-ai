    - data:
        code: "import json\nimport re\n\n# 1列目がこれらで始まる行は、直前の項目の続きとみなす\nCONTINUATION\
          \ = (\"IU/mL\", \"mIU/mL\", \"S/CO\", \"定性\", \"Intact\")\nARROWS = \"↑↓⇑⇓⬆⬇\"\
          \nFOOTER_MARKS = (\"ファルコ\", \"FALCO\", \"株式会社\")\n\n# 帳票の表記 → DBに入れる項目名(固定の対応表なのでコード側で確実に処理する)\n\
          NAME_MAP = {\n    \"無機リン\": \"リン\",\n    \"無機磷\": \"リン\",\n    \"AST(GOT)\"\
          : \"AST\",\n    \"ALT(GPT)\": \"ALT\",\n    \"ヘモグロビン量\": \"ヘモグロビン\",\n \
          \   \"ヘマトクリット値\": \"ヘマトクリット\",\n    \"PTH Intact\": \"PTH\",\n    \"Intact\
          \ PTH\": \"PTH\",\n    \"鉄飽和率（TSAT）\": \"TSAT\",\n    \"鉄飽和率(TSAT)\": \"\
          TSAT\",\n}\n\n\ndef tidy(text):\n    \"\"\"矢印・読み仮名・数字途中の空白など、LLMが直し漏らした分を機械的に整える\"\
          \"\"\n    text = (text if text is not None else \"\")\n    text = str(text).strip().strip(ARROWS).strip()\n\
          \    text = re.sub(r\"(\\d)\\.\\s+(\\d)\", r\"\\1.\\2\", text)        #\
          \ 「1. 0未満」→「1.0未満」\n    text = re.sub(r\"~\\s+\", \"~\", text)         \
          \              # 「13.5~ 17.6」→「13.5~17.6」\n    text = re.sub(r\"[　 ]*(インセイ|ヨウセイ)$\"\
          , \"\", text)        # 読み仮名を落とす\n    return text.strip()\n\n\ndef count_table_rows(ocr_text):\n\
          \    \"\"\"ヘッダー行より下、フッターより上の行数。LLMが返すべき件数の期待値\"\"\"\n    lines = (ocr_text\
          \ or \"\").splitlines()\n    start = None\n    for i, line in enumerate(lines):\n\
          \        if line.split(\"\\t\")[0].strip() == \"検査項目\":\n            start\
          \ = i + 1\n            break\n    if start is None:\n        return None\n\
          \    rows = 0\n    for line in lines[start:]:\n        if any(mark in line\
          \ for mark in FOOTER_MARKS):\n            break\n        rows += 1\n   \
          \ return rows\n\n\ndef build_items(raw_items):\n    \"\"\"続きの行を直前の項目に統合し、その後で結果が空の項目を捨てる\"\
          \"\"\n    merged = []\n    for raw in raw_items:\n        name = tidy(raw.get(\"\
          name\"))\n        row = {\"name\": name,\n               \"result\": tidy(raw.get(\"\
          result\")),\n               \"unit\": tidy(raw.get(\"unit\")),\n       \
          \        \"ref\": tidy(raw.get(\"ref\"))}\n\n        if merged and name.startswith(CONTINUATION):\n\
          \            parent = merged[-1]\n            if not parent[\"result\"]:\n\
          \                # 親に結果が無い場合は、親そのものの値として取り込む(PTH + Intact)\n           \
          \     parent[\"result\"] = row[\"result\"]\n                parent[\"unit\"\
          ] = row[\"unit\"]\n                parent[\"ref\"] = row[\"ref\"]\n    \
          \        elif row[\"result\"]:\n                # 親に結果がある場合は、別項目として枝分かれさせる(HBs抗原\
          \ + IU/mL)\n                branch = dict(row)\n                branch[\"\
          name\"] = parent[\"name\"] + \" (\" + name + \")\"\n                if not\
          \ branch[\"unit\"]:\n                    branch[\"unit\"] = name      #\
          \ 単位欄が空なら括弧内の単位で補う\n                merged.append(branch)\n            continue\
          \    # 値が無ければ何も足さない\n\n        merged.append(row)\n\n    final = [it for\
          \ it in merged if it[\"result\"]]   # 未実施と見出しはここで消える\n    for it in final:\n\
          \        it[\"name\"] = NAME_MAP.get(it[\"name\"], it[\"name\"])\n    return\
          \ final\n\n\ndef main(text: str, ocr: str) -> dict:\n    cleaned = re.sub(r\"\
          <think>.*?</think>\", \"\", text or \"\", flags=re.DOTALL)\n    cleaned\
          \ = re.sub(r\"^```(?:json)?|```$\", \"\", cleaned.strip(), flags=re.MULTILINE).strip()\n\
          \n    data = json.loads(cleaned)\n    raw_items = data.get(\"items\") or\
          \ []\n    items = build_items(raw_items)\n\n    expected = count_table_rows(ocr)\n\
          \    if expected is None or len(raw_items) == expected:\n        row_check\
          \ = \"OK\"\n    else:\n        row_check = \"NG 転記{}件 / 表{}行\".format(len(raw_items),\
          \ expected)\n\n    payload = {\n        \"date\": tidy(data.get(\"date\"\
          )),\n        \"time\": tidy(data.get(\"time\")),\n        \"dialysis\":\
          \ tidy(data.get(\"dialysis\")),\n        \"items\": items,\n    }\n    return\
          \ {\n        \"result\": json.dumps(payload, ensure_ascii=False),\n    \
          \    \"item_count\": len(items),\n        \"row_check\": row_check,\n  \
          \  }"
        code_language: python3
        outputs:
          item_count:
