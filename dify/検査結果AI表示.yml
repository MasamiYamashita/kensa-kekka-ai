          : \"副甲状腺ホルモン\",\n    \"パラサイロイドホルモン\": \"副甲状腺ホルモン\",\n    \"パラトルモン\": \"\
          副甲状腺ホルモン\",\n    \"上皮小体ホルモン\": \"副甲状腺ホルモン\",\n}\n\n\ndef main(llm_text:\
          \ str) -> dict:\n    cleaned = re.sub(r\"<think>.*?</think>\", \"\", llm_text,\
          \ flags=re.DOTALL).strip()\n    for wrong, right in TERM_MAP.items():\n\
          \        cleaned = cleaned.replace(wrong, right)\n    markdown = f\"![検査結果推移](http://localhost:8000/trend_image)\\\
